<head>
    <meta charset="utf-8">
    {{ $title := print .Site.Title " | " .Title }}
    {{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
    <title>{{ $title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.10.8/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.10.8/dist/cdn/beer.min.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    <script src='https://analytics.stacc.cc/api/script/4Wx5IIzJGQ8p'></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans&amp;family=Roboto Flex&amp;family=Rubik:wght@400;500&amp;display=swap"
        rel="stylesheet">
    <script src="/js/clipboard.js"></script>
    <meta name="keywords" content='{{ with .Params.keywords }}{{ delimit . " , "}}{{ end }}' />
    {{ with .Site.Params.description }}
    <meta name=" description" content="{{ . }}">
    {{ end }}
    <meta name="author" content="Daniel Benge">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
